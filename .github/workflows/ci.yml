name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-core:
    # 验证密钥扫描、编码规范与 MijiaCore 全量单测（Ubuntu + Swift 6.1）
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Secret & coding-standard checks
        run: |
          if grep -rnE 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' Sources/ Tests/; then
            echo "Detected hardcoded JWT token" && exit 1
          fi
          grep -q 'defaultSeededToken = ""' Sources/MijiaCore/KeychainAndPrefs.swift
          grep -q 'defaultHost = ""' Sources/MijiaCore/LGWebOSClient.swift
          if grep -rnE '10\.10\.1\.[0-9]+|4c:ba:d7:c3:e9:9a|localhost:3425' Sources/ Tests/; then
            echo "Detected hardcoded personal LAN IP/MAC or localhost:3425" && exit 1
          fi
          if grep -rnE 'event\.keyCode\s*==\s*[0-9]+' Sources/; then
            echo "Raw event.keyCode numeric literal found" && exit 1
          fi
      - name: Test MijiaCore on Linux
        run: bash scripts/linux-check/run.sh

  windows-core:
    # 验证 Windows 版 TypeScript 核心测试与前端打包
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install & Test & Build Frontend
        run: npm ci && npm test && npm run build

  windows-installer:
    # 编译 Windows 安装包并保留为 CI 产物，发布时再上传到对应版本。
    runs-on: windows-latest
    needs: [windows-core, linux-core]
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "windows/src-tauri -> target"
      - name: Install frontend & Tauri CLI dependencies
        run: npm ci
      - name: Build Windows Tauri installer (.exe & .msi)
        run: npx tauri build -- --locked
      - name: Collect Windows installers
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < ../VERSION)"
          mkdir -p ../dist-windows
          cp src-tauri/target/release/bundle/nsis/*.exe "../dist-windows/MenuBarMijia-${version}-windows-x64-setup.exe"
          cp src-tauri/target/release/bundle/msi/*.msi "../dist-windows/MenuBarMijia-${version}-windows-x64.msi"
          cd ../dist-windows
          sha256sum "MenuBarMijia-${version}-windows-x64-setup.exe" > "MenuBarMijia-${version}-windows-x64-setup.exe.sha256"
          sha256sum "MenuBarMijia-${version}-windows-x64.msi" > "MenuBarMijia-${version}-windows-x64.msi.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: MenuBarMijia-Windows-x64
          path: dist-windows/*

  macos:
    # Package.swift 要求 macOS 26 SDK（GitHub 托管 Runner 暂未提供 macos-26 镜像，仅手动或自托管触发）
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: brew install ripgrep
      - name: Build app (release)
        run: swift build -c release --product MenuBarMijiaApp
      - name: Lint & test
        run: bash scripts/check.sh
