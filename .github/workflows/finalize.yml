name: Finalize Release

# 第二阶段（人工触发）：把**已离线签名**的草稿发布出去（issue #17）。
#
# 为什么分开：应用内更新用离线 Ed25519 私钥签名，私钥必须留在维护者的可信机器上，绝不进入 GitHub。
# 本工作流只持有**公钥**（编译在 Sources/MijiaCore/UpdateChecker.swift 里），因此它无法伪造签名，
# 只能验证签名确实对应草稿里的那份 DMG——这正是独立信任链要保证的：GitHub 被攻破也发不出能通过
# 校验的更新包。
#
# 前置条件（在可信机器上完成）：
#   1. .github/workflows/release.yml 跑完，生成了 ${RELEASE_TAG} 的草稿（6 个附件）
#   2. 下载草稿里的 DMG，用离线私钥签名，并把 .ed25519.sig 上传回同一草稿
#   3. 手动触发本工作流，输入同一个 tag
#
# 本工作流不重新编译、不覆盖已发布的 release：签名必须对应草稿里的那份二进制。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已就绪的草稿 tag（例如 v1.0.7，必须与 VERSION 一致）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: finalize-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 用 tag 本身检出：VERSION、公钥、校验脚本都必须是被发布那个提交的版本。
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate tag, VERSION, and commit
        id: check
        run: bash scripts/check_release.sh tag "${RELEASE_TAG}"

      - name: Verify the remote tag still points at the checked-out commit
        run: |
          set -euo pipefail
          expected="${{ steps.check.outputs.commit }}"
          object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.type + " " + .object.sha')"
          type="${object%% *}"
          sha="${object##* }"
          if [ "$type" = "tag" ]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha')"
          fi
          if [ "$sha" != "$expected" ]; then
            echo "❌ 远程标签 ${RELEASE_TAG} 指向 $sha，不是检出的 $expected" >&2
            exit 1
          fi
          echo "✅ 远程标签 ${RELEASE_TAG} 指向 $expected"

      - name: Require an unpublished draft
        env:
          RELEASE_VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "❌ ${RELEASE_TAG} 还没有草稿；请先让 Release 工作流跑完并完成离线签名。" >&2
            exit 1
          fi
          is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" != "true" ]; then
            {
              echo "### ❌ ${RELEASE_TAG} 已经发布，本工作流不会覆盖已公开的 release"
              echo "请升版本号重新走一遍两阶段流程。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "❌ ${RELEASE_TAG} 已经是公开 release；拒绝覆盖（不使用 --clobber 改写已发布附件）。" >&2
            exit 1
          fi
          echo "✅ ${RELEASE_TAG} 是未发布的草稿"

      - name: Download the 7 draft assets
        env:
          RELEASE_VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          dmg="MenuBarMijia-${RELEASE_VERSION}.dmg"
          sig="${dmg}.ed25519.sig"

          # 先看草稿里有没有离线签名：缺它属于“还没走完第二阶段”，要和“签名不对”区分开。
          if ! gh release view "${RELEASE_TAG}" --json assets --jq -r '.assets[].name' \
            | tr -d '\r' | grep -qxF "$sig"; then
            {
              echo "### ⏳ ${RELEASE_TAG} 尚未完成离线签名"
              echo "草稿里没有 \`$sig\`，因此拒绝发布（宁可不发，也不发无法通过应用内更新校验的包）。"
              echo "请在**可信机器**上执行，私钥不要进入 GitHub："
              echo '```bash'
              echo "gh release download ${RELEASE_TAG} --pattern \"$dmg\" --dir dist"
              echo "MENUBARMIJIA_UPDATE_SIGNING_KEY=\"<离线私钥>\" swift scripts/sign_update.swift dist/$dmg"
              echo "gh release upload ${RELEASE_TAG} \"dist/$sig\""
              echo '```'
              echo "上传签名后重新触发本工作流。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "❌ 草稿缺少 $sig：等待维护者离线签名（issue #17），本工作流不代为签名。" >&2
            exit 1
          fi

          # 从草稿本身下载，而不是重新编译：签名只对草稿里那份 DMG 有效。
          gh release download "${RELEASE_TAG}" --dir dist
          ls -l dist

          # 附件集合必须严格是这 7 个；缺任何一个（含 .sha256）或出现多余文件都失败。
          if ! bash scripts/check_release.sh assets "${RELEASE_VERSION}" dist; then
            echo "❌ 草稿附件不完整，或 Ed25519 签名与草稿里的 DMG 不匹配。" >&2
            echo "   常见原因：DMG 被重新构建后仍挂着旧签名。请在可信机器上用当前 DMG 重新签名并覆盖 .sig 后重试。" >&2
            exit 1
          fi

      - name: Verify downloaded bytes match the draft server-side digests
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --json assets \
            --jq '.assets[] | "\(.name) \(.digest // "none") \(.size)"' | tr -d '\r' > "$RUNNER_TEMP/remote-assets.txt"
          while read -r name digest size; do
            [ -n "$name" ] || continue
            local_file="dist/${name}"
            local_size="$(wc -c < "$local_file" | tr -d '[:space:]')"
            if [ "$size" != "$local_size" ]; then
              echo "❌ ${name} 大小不一致：远端 ${size}，下载 ${local_size}" >&2
              exit 1
            fi
            if [ "$digest" = "none" ]; then
              echo "::warning::${name} 没有服务端 digest，仅校验了大小"
              continue
            fi
            local_digest="sha256:$(sha256sum "$local_file" | awk '{print $1}')"
            if [ "$digest" != "$local_digest" ]; then
              echo "❌ ${name} 的远端 digest ${digest} 与下载 ${local_digest} 不一致" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/remote-assets.txt"
          echo "✅ 7 个附件与服务端摘要一致"

      - name: Publish the draft (no rebuild, no asset overwrite)
        run: |
          set -euo pipefail
          # draft → public 是唯一一步写操作；这里不上传、不覆盖任何附件。
          gh release edit "${RELEASE_TAG}" --draft=false
          draft_state="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')"
          if [ "$draft_state" != "false" ]; then
            echo "❌ ${RELEASE_TAG} 仍然是草稿状态" >&2
            exit 1
          fi
          echo "✅ 已发布 ${RELEASE_TAG}"

      - name: Summarize
        env:
          RELEASE_VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "### 已发布 ${RELEASE_TAG}"
            echo "- 提交：${{ steps.check.outputs.commit }}"
            echo "- 附件：DMG + .ed25519.sig + .sha256，EXE/MSI + .sha256（共 7 个）"
            echo "- Ed25519：使用 UpdateChecker.swift 内置公钥验证，签名对应的就是草稿里的这份 DMG"
            echo "- 私钥：未进入 GitHub；CI 全程只做验证"
          } >> "$GITHUB_STEP_SUMMARY"
