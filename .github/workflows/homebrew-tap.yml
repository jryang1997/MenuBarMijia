name: Homebrew tap

# 把「已正式发布的 DMG」同步成 jryang1997/homebrew-tap 里的 cask（issue #61）。
#
# 触发路径：
#   release: published —— 人工在网页/CLI 上用**自己的**凭据发布 release 时触发。
#   workflow_run       —— 本仓库的「Release」或「Finalize Release」工作流结束后触发。这是自动路径：
#                         release.yml 只建草稿，finalize.yml 用 GITHUB_TOKEN 把草稿转正式发布，
#                         而 GITHUB_TOKEN 引发的事件不会再生成新的 workflow run（GitHub 递归保护）。
#                         发版工作流本身是人工启动的，它结束后 workflow_run 会正常触发；本工作流随后
#                         用 API 权威判定「这次运行真的产出了一个新的正式 release 吗」，没有就明确跳过。
#   workflow_dispatch  —— 手动指定版本；默认 dry_run=true，只产出可 review 的 cask artifact。
#
# 无论走哪条路径，写入 tap 前都要：读 release 元数据 → 下载 DMG → 独立校验 SHA-256 →
# 渲染 cask → 与「已发布版本」逐字节比对（--check 语义）→ 只提交一个文件。
#
# 本工作流不创建 homebrew-tap 仓库、不改任何 secret、不发 release，也不做任何签名/公证。
# 缺少 HOMEBREW_TAP_TOKEN 或 tap 仓库时，publish job 会以明确的失败结束，而不是假装成功。
on:
  release:
    types: [published]
  workflow_run:
    # 只听本仓库这两个工作流（见上方注释）。改它们的 name 会断开自动同步。
    workflows: [Release, Finalize Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "要写入 tap 的版本（X.Y.Z，必须已有正式发布的 release，例如 1.0.6）"
        required: true
        type: string
      dry_run:
        description: "只生成 cask artifact，不写 jryang1997/homebrew-tap"
        required: false
        type: boolean
        default: true
  # PR / main 推送只跑离线自检：不联网、不需要凭据、也不触碰 tap。
  pull_request:
    paths:
      - packaging/homebrew/**
      - .github/workflows/homebrew-tap.yml
  push:
    branches: [main]
    paths:
      - packaging/homebrew/**
      - .github/workflows/homebrew-tap.yml

# 权限：默认只读。跨仓库写入只用 HOMEBREW_TAP_TOKEN，publish job 不需要 contents: write。
permissions:
  contents: read

concurrency:
  # 同一事件源只保留最新一次运行；真正的跨仓库写入在 publish job 内再串行一层。
  group: homebrew-tap-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.release.tag_name || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    # 离线自检：只用本地合成 fixture，验证生成器的正常路径与全部拒绝路径。
    # 这是没有凭据的环境里唯一能跑的验证，渲染与写入都以它为前提。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cask generator self-test
        run: bash packaging/homebrew/self_test.sh

  resolve:
    # 把各条触发路径统一成一个 (version, proceed) 判断，并把「是否真的已发布」交给 API 权威判定。
    # PR / main 推送不进入这里：那时只有离线自检在跑。
    needs: self-test
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      proceed: ${{ steps.resolve.outputs.proceed }}
    steps:
      - name: Resolve the target version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          skip() {
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏭ 本次不更新 Homebrew tap"
              echo "$1"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "⏭ $1"
          }
          valid_version() {
            printf '%s' "$1" | grep -Eq '^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$'
          }
          # 带重试的 gh api：CI 上的瞬时网络错误既不能当成「没有 release」（那会静默不更新 tap，
          # 假装成功），也不该直接崩掉。stdout 原样透传给调用方；只有 404 当作确定结论返回 2，
          # 其他错误重试后仍然失败就返回 1。
          API_ERR=""
          api_with_retry() {
            local attempt status
            API_ERR=""
            for attempt in 1 2 3; do
              status=0
              gh api "$@" 2> "$RUNNER_TEMP/gh-api.err" || status=$?
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              API_ERR="$(tr -d '\r' < "$RUNNER_TEMP/gh-api.err" | head -n 3 | tr '\n' ' ')"
              if printf '%s' "$API_ERR" | grep -q 'HTTP 404'; then
                return 2
              fi
              echo "::warning::gh api 第 $attempt 次失败：$API_ERR" >&2
              if [ "$attempt" -lt 3 ]; then
                sleep 3
              fi
            done
            return 1
          }

          case "$EVENT_NAME" in
            pull_request|push)
              skip "PR / main 推送只做离线自检，不联网、不写 tap。"
              exit 0
              ;;
            release)
              if [ "${RELEASE_DRAFT:-false}" = "true" ] || [ "${RELEASE_PRERELEASE:-false}" = "true" ]; then
                skip "release 仍是 draft 或 prerelease：这类附件对外不可下载，不进入默认 tap。"
                exit 0
              fi
              raw="${RELEASE_TAG:-}"
              ;;
            workflow_run)
              # Release 工作流刚结束：用它本身确定「这一次运行发布了哪个版本」。
              # 不用 head_branch 猜（workflow_dispatch 触发的发版 head_branch 是分支名），
              # 而是取最近发布、且发布时间落在本次运行开始时间之后的那一个 release。
              if [ "${RUN_REPO:-}" != "${GITHUB_REPOSITORY}" ]; then
                skip "workflow_run 来自 ${RUN_REPO:-<未知仓库>}，不是本仓库的 Release 工作流。"
                exit 0
              fi
              if [ -z "${RUN_CREATED_AT:-}" ]; then
                echo "❌ workflow_run 载荷缺少 created_at，无法判断本次发布了什么" >&2
                exit 1
              fi
              if [ "${RUN_CONCLUSION:-}" != "success" ]; then
                echo "::warning::Release 工作流结论为 '${RUN_CONCLUSION:-unknown}'；下面按 release 的实际状态判断。"
              fi
              releases_list="$RUNNER_TEMP/releases.txt"
              api_with_retry "repos/${GITHUB_REPOSITORY}/releases?per_page=50" \
                --jq '.[] | select(.draft == false and .prerelease == false and (.published_at // "") != "") | "\(.published_at) \(.tag_name)"' \
                > "$releases_list" || {
                  echo "❌ 读取 release 列表失败（不是 404，按失败处理）：$API_ERR" >&2
                  exit 1
                }
              # published_at 与 created_at 都是 RFC3339 UTC（...Z），同格式下字符串比较即时间先后。
              published=""
              newest=""
              while read -r published_at tag; do
                [ -n "${published_at:-}" ] || continue
                if [[ ! "$published_at" < "$RUN_CREATED_AT" ]] && { [ -z "$newest" ] || [[ "$published_at" > "$newest" ]]; }; then
                  newest="$published_at"
                  published="$tag"
                fi
              done < "$releases_list"
              if [ -z "$published" ]; then
                skip "本次 Release 运行没有产出新的正式 release（失败、只剩草稿，或没有发布动作），tap 保持不动。"
                exit 0
              fi
              raw="$published"
              ;;
            workflow_dispatch)
              raw="${DISPATCH_VERSION:-}"
              ;;
            *)
              echo "❌ 未知触发事件：$EVENT_NAME" >&2
              exit 1
              ;;
          esac

          # 只去掉一个可选的 v 前缀；其余字符交给严格校验。
          case "$raw" in
            v*) version="${raw#v}" ;;
            *) version="$raw" ;;
          esac
          if ! valid_version "$version"; then
            echo "❌ 版本必须是 X.Y.Z（收到：'$raw'）" >&2
            exit 1
          fi

          # 所有路径都再向 API 确认一次：该 tag 确实存在已发布的 release。
          # 只有 404 才算「确实没有 release」；网络/其他错误重试后仍然失败就硬失败，
          # 绝不用「读不到」冒充「没发布」。
          state=""
          api_status=0
          api_with_retry "repos/${GITHUB_REPOSITORY}/releases/tags/v${version}" \
            --jq '"\(.draft) \(.prerelease)"' > "$RUNNER_TEMP/state.txt" || api_status=$?
          if [ "$api_status" -eq 1 ]; then
            echo "❌ 读取 v${version} 的 release 状态失败（不是 404）：$API_ERR" >&2
            exit 1
          fi
          if [ "$api_status" -eq 2 ]; then
            skip "v${version} 没有 release（HTTP 404）；tap 保持不动。"
            exit 0
          fi
          state="$(tr -d '\r' < "$RUNNER_TEMP/state.txt")"
          if ! printf '%s' "$state" | grep -Eq '^(true|false) (true|false)$'; then
            echo "❌ v${version} 的 release 状态无法解析：'$state'" >&2
            exit 1
          fi
          if [ "$state" != "false false" ]; then
            skip "v${version} 的 release 是 draft/prerelease（$state），对外不可下载；tap 保持不动。"
            exit 0
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "✅ 目标版本：$version（事件：$EVENT_NAME）"

  render:
    # 只读 job：下载已发布 DMG、独立校验 SHA-256、渲染 cask，并把结果留成可 review 的 artifact。
    # 每次运行都真的联网取附件，所以 dry-run 的产物与真正写入 tap 的内容逐字节相同。
    needs: resolve
    if: github.repository == 'jryang1997/MenuBarMijia' && needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.cask.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render and verify the cask from the published release
        id: cask
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          bash packaging/homebrew/update_cask.sh \
            --version "$VERSION" \
            --cask-dir "$RUNNER_TEMP/Casks" \
            --github-output "$GITHUB_OUTPUT"

      - name: Show the rendered cask
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "### Homebrew cask ${VERSION}"
            echo '```ruby'
            cat "$RUNNER_TEMP/Casks/menubarmijia.rb"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-cask
          path: ${{ runner.temp }}/Casks/menubarmijia.rb
          if-no-files-found: error
          retention-days: 14

  publish:
    # 跨仓库写入。release / 已完成的 Release 工作流会自动执行；手动触发默认只做 dry-run。
    needs: [resolve, render]
    if: >-
      github.repository == 'jryang1997/MenuBarMijia'
      && needs.resolve.outputs.proceed == 'true'
      && (github.event_name == 'release' || github.event_name == 'workflow_run' || inputs.dry_run == false)
    # 单独串行：两次运行同时推同一个 tap 会互相造成 non-fast-forward。
    concurrency:
      group: homebrew-tap-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAP_REPO: jryang1997/homebrew-tap
      TAP_CASK_PATH: Casks/menubarmijia.rb
    steps:
      - name: Preflight tap credentials
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          summary() {
            {
              echo "### ❌ $1"
              shift
              for line in "$@"; do echo "$line"; done
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          }
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            summary "缺少 HOMEBREW_TAP_TOKEN，已拒绝更新 tap" \
              "本工作流不创建 homebrew-tap 仓库、也不改任何 secret。需要人工完成：" \
              '1. 在 `jryang1997` 下创建公开仓库 `homebrew-tap`（tap 名即 `jryang1997/tap`）；' \
              "2. 建一个只对该仓库有 contents: write 的细粒度 PAT（或 GitHub App 令牌）；" \
              '3. 在 MenuBarMijia 仓库 Settings → Secrets 里添加 `HOMEBREW_TAP_TOKEN`。' \
              "在此之前 cask 只留在 artifact 里，tap 没有更新。"
            echo "❌ 未配置 HOMEBREW_TAP_TOKEN：tap 未更新（这不是成功，只是没有凭据）" >&2
            exit 1
          fi
          if ! permission="$(GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api "repos/${TAP_REPO}" --jq '.permissions.push' 2>/dev/null)"; then
            summary "无法访问 ${TAP_REPO}" \
              "HOMEBREW_TAP_TOKEN 存在，但读不到该仓库：仓库可能还没创建，或令牌没有 scope。" \
              "工作流不会代替你创建仓库，也不会修改令牌。"
            echo "❌ 令牌无法访问 ${TAP_REPO}" >&2
            exit 1
          fi
          if [ "$permission" != "true" ]; then
            summary "令牌对 ${TAP_REPO} 没有 push 权限" "permissions.push=$permission"
            echo "❌ 令牌对 ${TAP_REPO} 没有 push 权限（permissions.push=$permission）" >&2
            exit 1
          fi
          echo "✅ 已确认令牌对 ${TAP_REPO} 有写权限"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jryang1997/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          # 只需要默认分支的最新提交；浅克隆避免拉下整个 tap 历史。
          # 刻意保留凭据：后面的 push 复用同一份 token。
          fetch-depth: 1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew-cask
          path: ${{ runner.temp }}/generated

      - name: Verify the tap checkout is the default branch
        id: branch
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          branch="$(git -C tap rev-parse --abbrev-ref HEAD)"
          if [ "$branch" = "HEAD" ]; then
            echo "❌ tap 检出处于 detached HEAD，拒绝提交" >&2
            exit 1
          fi
          default_branch="$(GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api "repos/${TAP_REPO}" --jq '.default_branch')"
          if [ "$branch" != "$default_branch" ]; then
            echo "❌ tap 检出在 ${branch}，不是默认分支 ${default_branch}；拒绝写入" >&2
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "✅ tap 默认分支：${branch}"

      - name: Refuse to downgrade the cask
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          existing="tap/${TAP_CASK_PATH}"
          if [ ! -f "$existing" ]; then
            echo "▶ tap 里还没有 $TAP_CASK_PATH，本次是首次写入"
            exit 0
          fi
          current="$(sed -n 's/^  version "\(.*\)"$/\1/p' "$existing" | head -n 1)"
          if [ -z "$current" ]; then
            echo "❌ $existing 里读不到 version 字段，拒绝自动覆盖（请人工检查）" >&2
            exit 1
          fi
          if ! printf '%s' "$current" | grep -Eq '^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$'; then
            echo "❌ $existing 的 version '$current' 不是 X.Y.Z" >&2
            exit 1
          fi
          if [ "$current" = "$VERSION" ]; then
            echo "▶ tap 已是 $VERSION，接下来只比较内容是否需要提交"
            exit 0
          fi
          highest="$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)"
          if [ "$highest" = "$current" ]; then
            echo "❌ tap 里的 cask 已是 $current，拒绝用更旧的 $VERSION 覆盖（避免旧 release 回滚 tap）" >&2
            exit 1
          fi
          echo "▶ tap 将从 $current 升级到 $VERSION"

      - name: Commit only the cask change
        id: commit
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/generated/menubarmijia.rb"
          [ -s "$generated" ] || { echo "❌ 缺少生成的 cask：$generated" >&2; exit 1; }
          generated_sha="$(sha256sum < "$generated" | awk '{print $1}')"
          mkdir -p "tap/$(dirname "$TAP_CASK_PATH")"
          cp "$generated" "tap/$TAP_CASK_PATH"
          if [ "$(sha256sum < "tap/$TAP_CASK_PATH" | awk '{print $1}')" != "$generated_sha" ]; then
            echo "❌ 复制到 tap 后内容不一致" >&2
            exit 1
          fi
          cd tap
          # 只 stage 这一个路径，绝不用 git add -A / git checkout -- .，避免碰别人的 cask。
          git add -- "$TAP_CASK_PATH"
          staged="$(git diff --cached --name-only | tr -d '\r')"
          if [ -z "$staged" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ tap 已经是 v${VERSION} 的目标内容，无需提交"
            exit 0
          fi
          if [ "$staged" != "$TAP_CASK_PATH" ]; then
            echo "❌ 索引里出现了非预期路径：$staged；已中止，未提交任何内容" >&2
            exit 1
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --message "menubarmijia ${VERSION}" -- "$TAP_CASK_PATH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "✅ 已提交 menubarmijia ${VERSION}"

      - name: Push the cask update
        if: steps.commit.outputs.changed == 'true'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          DMG_SHA256: ${{ needs.render.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd tap
          if [ -z "${BRANCH:-}" ]; then
            echo "❌ 没有解析出 tap 的默认分支名，拒绝推送" >&2
            exit 1
          fi
          # 显式推到默认分支、绝不 force：远端被别人推进过就让本次失败，人工处理。
          if ! git push origin "HEAD:refs/heads/${BRANCH}"; then
            echo "❌ 推送被拒绝（远端可能有新提交）。本工作流不会 force push；重跑会在新基线上重算 cask。" >&2
            exit 1
          fi
          {
            echo "### 已更新 ${TAP_REPO}"
            echo "- cask：\`${TAP_CASK_PATH}\` → menubarmijia ${VERSION}"
            echo "- DMG SHA-256：\`${DMG_SHA256:-<未记录>}\`"
            echo '- 安装：`brew install --cask jryang1997/tap/menubarmijia`'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
